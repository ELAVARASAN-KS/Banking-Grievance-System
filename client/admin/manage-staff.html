<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff - Grievance Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Grievance Management</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3 sidebar">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/add-staff}">Add Staff</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/admin/manage-staff}">Manage Staff</a>
                </li>
            </ul>
        </div>

        <!-- CONTENT -->
        <div class="col-md-9 mt-4">

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <h2 class="mb-4">Manage Staff</h2>

            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">All Staff Members</h4>
                </div>

                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Work Name</th>
                                <th>View</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:if="${#lists.isEmpty(staffList)}">
                                <td colspan="5" class="text-center">No staff members found</td>
                            </tr>

                            <tr th:each="staff : ${staffList}">
                                <td th:text="${staff.id}"></td>
                                <td th:text="${staff.name}"></td>
                                <td th:text="${staff.email}"></td>
                                <td th:text="${staff.workName}"></td>
                                <td>
                                    <button
                                            class="btn btn-sm btn-primary"
                                            data-bs-toggle="modal"
                                            data-bs-target="#staffModal"
                                            th:attr="
                                                data-name=${staff.name},
                                                data-email=${staff.email},
                                                data-work='0'
                                            ">
                                        View
                                    </button>
                                </td>
                            </tr>
                            </tbody>

                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- VIEW MODAL -->
<div class="modal fade" id="staffModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Staff Information</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p><strong>Name:</strong> <span id="modalName"></span></p>
                <p><strong>Email:</strong> <span id="modalEmail"></span></p>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const staffModal = document.getElementById('staffModal');

    staffModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;

        document.getElementById('modalName').textContent =
            button.getAttribute('data-name');

        document.getElementById('modalEmail').textContent =
            button.getAttribute('data-email');

        document.getElementById('modalWork').textContent =
            button.getAttribute('data-work');
    });
</script>

</body>
</html>
