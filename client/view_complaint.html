<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>View Complaint — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-gray-200 min-h-screen">
<header class="bg-gray-900 p-4"><div class="max-w-6xl mx-auto"><h1 class="text-xl text-blue-300 font-semibold">Complaint Details</h1></div></header>

<main class="max-w-6xl mx-auto p-6">
  <div id="detailsBox" class="bg-[#111827] p-6 rounded-lg border border-gray-800">Loading...</div>
</main>

<script>
const API = 'http://localhost:8080/api';
async function loadDetails() {
  const num = new URLSearchParams(window.location.search).get('number');
  if (!num) { document.getElementById('detailsBox').innerText = 'Missing number'; return; }
  const res = await fetch(`${API}/complaints/number/${encodeURIComponent(num)}`);
  if (!res.ok) { document.getElementById('detailsBox').innerText = 'Not found'; return; }
  const c = await res.json();
  document.getElementById('detailsBox').innerHTML = `
    <h2 class="text-lg font-semibold mb-2">${c.subject}</h2>
    <p class="text-sm text-gray-400 mb-2">#${c.complaintNumber} • ${c.category}</p>
    <p class="mb-4">${c.description}</p>
    <p class="mb-2"><b>Status:</b> ${c.status}</p>
    <p class="mb-2"><b>Assigned staff:</b> ${c.staffId ?? 'Not assigned'}</p>
    <p class="mb-2"><b>Resolution:</b> ${c.resolutionNotes ?? '—'}</p>
    <div class="mt-4"><a href="admin_dashboard.html" class="px-4 py-2 bg-gray-700 rounded">Back</a></div>
  `;
}
loadDetails();
</script>
</body>
</html>
