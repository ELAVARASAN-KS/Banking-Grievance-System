<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Staff — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-gray-200 min-h-screen">

<header class="bg-gray-900 p-4">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-xl text-blue-300 font-semibold">Manage Staff</h1>
    <a href="add_staff.html" class="px-4 py-2 bg-blue-600 rounded-lg">Add Staff</a>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6">
  <div id="staffList" class="grid md:grid-cols-2 gap-4"></div>
</main>

<script>
const API = 'http://localhost:8080/api';
document.addEventListener('DOMContentLoaded', () => {
  loadStaff();
});

async function loadStaff() {
  const res = await fetch(`${API}/staff`);
  const list = await res.json();
  const box = document.getElementById('staffList');
  box.innerHTML = '';
  list.forEach(s => {
    const card = document.createElement('div');
    card.className = 'p-4 bg-[#161b22] rounded-lg border border-gray-800';
    card.innerHTML = `<h3 class="font-semibold">${s.fullName}</h3>
      <p class="text-sm text-gray-400">${s.position} • ${s.department}</p>
      <p class="text-sm mt-2">${s.email}</p>`;
    box.appendChild(card);
  });
}
</script>

</body>
</html>
