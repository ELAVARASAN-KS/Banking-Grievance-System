<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Complaint Submitted — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-indigo-900 text-white">

  <div class="max-w-lg p-8 bg-white/5 rounded-2xl text-center">
    <div class="mb-6">
      <svg class="w-16 h-16 mx-auto text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <h2 class="text-2xl font-bold mb-2">Complaint Submitted</h2>
    <p id="complaintInfo" class="text-gray-300 mb-6">Thank you. Your grievance has been recorded.</p>

    <a id="homeBtn" href="user_dashboard.html" class="inline-block px-6 py-3 bg-blue-600 rounded-lg">Go to Dashboard</a>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const title = params.get('title');
if (id) document.getElementById('complaintInfo').textContent = `Complaint Number: ${id}${title ? ' — ' + decodeURIComponent(title) : ''}`;
</script>

</body>
</html>
