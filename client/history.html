<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Complaint History — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0d1117] text-gray-200 min-h-screen">

<header class="bg-gray-900 p-6">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-2xl text-blue-300 font-bold">Complaint History</h1>
    <a href="user_dashboard.html" class="px-4 py-2 bg-gray-700 rounded-lg">Back</a>
  </div>
</header>

<main class="max-w-6xl mx-auto p-8">
  <div id="history" class="space-y-4"></div>
</main>

<script>
const API = "http://localhost:8080/api";

async function loadHistory() {
  const auth = JSON.parse(localStorage.getItem("auth"));
  if (!auth || auth.role !== "user") {
    window.location.href = "login.html";
    return;
  }

  const res = await fetch(`${API}/complaints/user/${auth.data.userId}`);
  const list = await res.json();
  const box = document.getElementById("history");
  box.innerHTML = "";

  if (list.length === 0) {
    box.innerHTML = "<p class='text-gray-400'>No complaint history found.</p>";
    return;
  }

  list.forEach(c => {
    const card = document.createElement("div");
    card.className =
      "p-4 bg-[#161b22] rounded-lg border border-gray-800";

    card.innerHTML = `
      <h3 class="font-semibold text-lg">${c.subject}</h3>
      <p class="text-sm text-gray-400">#${c.complaintNumber} • ${c.category}</p>
      <p class="mt-2">${c.description}</p>
      <p class="mt-3"><b>Status:</b> ${c.status}</p>
      <p class="mt-2"><b>Resolution:</b> ${c.resolutionNotes ?? "—"}</p>
    `;

    box.appendChild(card);
  });
}

loadHistory();
</script>

</body>
</html>
