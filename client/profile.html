<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0d1117] text-gray-200 min-h-screen">

<header class="bg-gray-900 p-6">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-2xl text-blue-300 font-bold">Profile</h1>
    <a href="user_dashboard.html" class="px-4 py-2 bg-gray-700 rounded-lg">Back</a>
  </div>
</header>

<main class="max-w-6xl mx-auto p-8">
  <div id="profileBox" class="p-6 bg-[#161b22] rounded-lg border border-gray-800">
    Loading profile...
  </div>
</main>

<script>
const API = "http://localhost:8080/api";

async function loadProfile() {
  const auth = JSON.parse(localStorage.getItem("auth"));
  if (!auth || auth.role !== "user") {
    window.location.href = "login.html";
    return;
  }

  const res = await fetch(`${API}/users/${auth.data.userId}`);
  const u = await res.json();

  const box = document.getElementById("profileBox");
  box.innerHTML = `
    <h2 class="text-lg font-semibold mb-2">${u.fullName}</h2>
    <p class="mb-1"><b>Email:</b> ${u.email}</p>
    <p class="mb-1"><b>Mobile:</b> ${u.mobileNumber}</p>
    <p class="mb-1"><b>Account ID:</b> ${u.accountId}</p>
    <p class="mb-1"><b>Registered:</b> ${u.registeredOn}</p>
  `;
}

loadProfile();
</script>

</body>
</html>
