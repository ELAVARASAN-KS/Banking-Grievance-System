<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Check Status — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-gray-200 min-h-screen">

  <header class="p-6 bg-gray-900">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-2xl text-blue-300 font-bold">Check Complaint Status</h1>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-8">
    <div class="bg-[#161b22] p-6 rounded-lg border border-gray-800">
      <div class="flex gap-3 mb-4">
        <input id="complaintNumber" placeholder="Enter complaint number (e.g., GR-8012)" class="flex-1 p-3 bg-gray-900 rounded-lg" />
        <button id="checkBtn" class="px-4 py-3 bg-blue-600 rounded-lg">Search</button>
      </div>

      <div id="result" class="mt-4 text-gray-300"></div>
    </div>
  </main>

<script>
document.getElementById('checkBtn').addEventListener('click', async () => {
  const num = document.getElementById('complaintNumber').value.trim();
  if (!num) { alert('Enter complaint number'); return; }

  try {
    const res = await fetch(`http://localhost:8080/api/complaints/number/${encodeURIComponent(num)}`);
    if (!res.ok) { alert('Not found'); return; }
    const data = await res.json();
    document.getElementById('result').innerHTML = `
      <p><b>Number:</b> ${data.complaintNumber}</p>
      <p><b>Status:</b> ${data.status}</p>
      <p><b>Category:</b> ${data.category}</p>
      <p><b>Subject:</b> ${data.subject}</p>
      <p><b>Description:</b> ${data.description}</p>
      <p><b>Assigned Staff:</b> ${data.staffId ?? 'Not assigned'}</p>
    `;
  } catch (e) { console.error(e); alert('Network error'); }
});
</script>
</body>
</html>
