<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0d1117] text-gray-200 min-h-screen">
<header class="bg-gray-900 p-6">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-2xl text-blue-300 font-bold">Staff Dashboard</h1>
    <button id="logoutBtn" class="px-4 py-2 bg-red-600 rounded-lg">Logout</button>
  </div>
</header>

<main class="max-w-6xl mx-auto p-8">
  <h2 class="text-xl mb-4">Assigned Complaints</h2>
  <div id="assigned" class="space-y-4"></div>
</main>

<script>
const API = "http://localhost:8080/api";

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("auth");
  window.location.href = "login.html";
});

async function loadAssignedComplaints() {
  const auth = JSON.parse(localStorage.getItem("auth"));
  if (!auth || auth.role !== "staff") {
    window.location.href = "login.html";
    return;
  }

  const res = await fetch(`${API}/complaints/staff/${auth.data.staffId}`);
  const list = await res.json();

  const box = document.getElementById("assigned");
  box.innerHTML = "";

  if (list.length === 0) {
    box.innerHTML = "<p class='text-gray-400'>No complaints assigned.</p>";
    return;
  }

  list.forEach(c => {
    const card = document.createElement("div");
    card.className =
      "p-4 bg-[#111827] rounded-lg border border-gray-800";

    card.innerHTML = `
      <h3 class="font-semibold text-lg">${c.subject}</h3>
      <p class="text-sm text-gray-400">#${c.complaintNumber} • ${c.category}</p>
      <p class="mt-2">${c.description}</p>

      <p class="mt-3 text-sm">
        <b>Status:</b> ${c.status}
      </p>

      <div class="mt-4 flex gap-2">
        <button onclick="updateStatus(${c.complaintId}, 'In Progress')" 
          class="px-4 py-2 bg-blue-600 rounded-lg">Mark In Progress</button>

        <button onclick="updateStatus(${c.complaintId}, 'Resolved')" 
          class="px-4 py-2 bg-green-600 rounded-lg">Mark Resolved</button>
      </div>
    `;
    box.appendChild(card);
  });
}

async function updateStatus(id, status) {
  const notes = prompt("Add resolution notes (optional):") || "";

  const res = await fetch(`${API}/complaints/${id}/status`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status, resolutionNotes: notes })
  });

  if (res.ok) {
    alert("Status updated");
    loadAssignedComplaints();
  } else {
    alert("Failed to update status");
  }
}

loadAssignedComplaints();
</script>
</body>
</html>
