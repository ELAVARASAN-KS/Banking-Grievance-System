<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Grievance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Grievance Management</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/user/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/user/raise-complaint}">Raise Complaint</a>
                <a class="nav-link" th:href="@{/user/track-complaint}">Track Complaint</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Submit Feedback</h4>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <div th:if="${grievance}" class="mb-4">
                    <h5>Complaint Details</h5>
                    <p><strong>ID:</strong> <span th:text="${grievance.id}"></span></p>
                    <p><strong>Title:</strong> <span th:text="${grievance.title}"></span></p>
                </div>

                <form th:action="@{/user/feedback}" method="post">
                    <input type="hidden" name="grievanceId" th:value="${grievance.id}">
                    
                    <div class="mb-3">
                        <label class="form-label">Rating</label>
                        <div>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                            <label for="rating1">⭐</label>
                            
                            <input type="radio" id="rating2" name="rating" value="2">
                            <label for="rating2">⭐⭐</label>
                            
                            <input type="radio" id="rating3" name="rating" value="3">
                            <label for="rating3">⭐⭐⭐</label>
                            
                            <input type="radio" id="rating4" name="rating" value="4">
                            <label for="rating4">⭐⭐⭐⭐</label>
                            
                            <input type="radio" id="rating5" name="rating" value="5">
                            <label for="rating5">⭐⭐⭐⭐⭐</label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="comments" class="form-label">Comments</label>
                        <textarea class="form-control" id="comments" name="comments" rows="5"></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Submit Feedback</button>
                    <a th:href="@{/user/dashboard}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
    <footer class="footer text-center py-3 mt-auto">
        © 2025 Banking Grievance System. All Rights Reserved.
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
