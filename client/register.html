<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-700 to-indigo-700 flex items-center justify-center">

  <div class="w-full max-w-lg p-8 bg-white/10 backdrop-blur rounded-2xl shadow-xl">
    <h2 class="text-2xl text-white font-bold text-center mb-6">Create Account</h2>

    <div class="space-y-4">
      <input id="fullname" placeholder="Full name" class="w-full p-3 rounded-lg bg-gray-900 text-white" />
      <input id="email" placeholder="Email" class="w-full p-3 rounded-lg bg-gray-900 text-white" />
      <input id="mobile" placeholder="Mobile number" class="w-full p-3 rounded-lg bg-gray-900 text-white" />
      <input id="password" type="password" placeholder="Password" class="w-full p-3 rounded-lg bg-gray-900 text-white" />
      <button id="registerBtn" class="w-full py-3 rounded-lg bg-blue-500 text-white font-semibold">Register</button>
    </div>

    <p class="text-center text-white/80 mt-4">Already registered? <a href="login.html" class="underline">Login</a></p>
  </div>

<script>
document.getElementById('registerBtn').addEventListener('click', async () => {
  const fullName = document.getElementById('fullname').value.trim();
  const email = document.getElementById('email').value.trim();
  const mobileNumber = document.getElementById('mobile').value.trim();
  const password = document.getElementById('password').value;

  if (!fullName || !email || !mobileNumber || !password) { alert('Fill all fields'); return; }

  const payload = { fullName, email, mobileNumber, password, accountId: 'AC' + Math.floor(100000 + Math.random()*900000) };

  try {
    const res = await fetch('http://localhost:8080/api/auth/register', {
      method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(payload)
    });
    const body = await res.json();
    if (!res.ok) { alert(body.message || 'Registration failed'); return; }
    alert('Registration successful'); window.location.href = 'login.html';
  } catch (e) { console.error(e); alert('Network error'); }
});
</script>

</body>
</html>
