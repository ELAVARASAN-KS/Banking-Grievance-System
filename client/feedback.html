<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Feedback — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0d1117] text-gray-200 min-h-screen flex items-center justify-center">

<div class="max-w-xl p-8 bg-[#161b22] rounded-lg border border-gray-800">
  <h2 class="text-xl font-bold mb-4">Submit Feedback</h2>

  <label class="block mb-2 text-gray-300">Rating</label>
  <select id="rating" class="w-full p-3 bg-gray-900 rounded-lg mb-4">
    <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
    <option value="4">⭐⭐⭐⭐ (Good)</option>
    <option value="3">⭐⭐⭐ (Average)</option>
    <option value="2">⭐⭐ (Poor)</option>
    <option value="1">⭐ (Very Poor)</option>
  </select>

  <label class="block mb-2 text-gray-300">Your Feedback</label>
  <textarea id="feedback" rows="5" class="w-full p-3 bg-gray-900 rounded-lg mb-4"></textarea>

  <div class="flex justify-between">
    <button onclick="submitFeedback()" class="px-4 py-2 bg-green-600 rounded-lg">Submit</button>
    <a href="user_dashboard.html" class="px-4 py-2 bg-gray-700 rounded-lg">Cancel</a>
  </div>
</div>

<script>
const API = "http://localhost:8080/api";

async function submitFeedback() {
  const complaintId = new URLSearchParams(window.location.search).get("id");
  const rating = document.getElementById("rating").value;
  const feedbackText = document.getElementById("feedback").value.trim();

  if (!feedbackText) {
    alert("Please write your feedback.");
    return;
  }

  const payload = { complaintId, rating, feedbackText };

  const res = await fetch(`${API}/feedback`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  if (res.ok) {
    alert("Feedback submitted successfully!");
    window.location.href = "user_dashboard.html";
  } else {
    alert("Failed to submit feedback.");
  }
}
</script>

</body>
</html>
