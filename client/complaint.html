<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register Complaint — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-gray-200 min-h-screen">

  <header class="p-6 bg-gray-900">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-2xl text-blue-300 font-bold">Register Complaint</h1>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-8">
    <div class="bg-[#161b22] p-8 rounded-lg border border-gray-800">
      <div class="mb-4">
        <label class="block mb-1">Category</label>
        <select id="category" class="w-full p-3 bg-gray-900 rounded-lg">
          <option>Account Issue</option>
          <option>Transaction Issue</option>
          <option>ATM Issue</option>
          <option>Card Issue</option>
          <option>Customer Service</option>
          <option>Others</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block mb-1">Subject</label>
        <input id="subject" class="w-full p-3 bg-gray-900 rounded-lg" />
      </div>

      <div class="mb-4">
        <label class="block mb-1">Description</label>
        <textarea id="description" rows="6" class="w-full p-3 bg-gray-900 rounded-lg"></textarea>
      </div>

      <div class="flex gap-3">
        <button id="submitComplaint" class="px-6 py-3 bg-blue-600 rounded-lg">Submit Complaint</button>
        <a href="user_dashboard.html" class="px-6 py-3 bg-gray-700 rounded-lg">Back</a>
      </div>
    </div>
  </main>

<script>
document.getElementById('submitComplaint').addEventListener('click', async () => {
  const auth = JSON.parse(localStorage.getItem('auth'));
  if (!auth || !auth.data || auth.role === 'admin') { alert('Please login as user'); return; }

  const payload = {
    userId: auth.data.userId,
    subject: document.getElementById('subject').value.trim(),
    category: document.getElementById('category').value,
    description: document.getElementById('description').value.trim()
  };

  if (!payload.subject || !payload.description) { alert('Fill title and description'); return; }

  try {
    const res = await fetch('http://localhost:8080/api/complaints', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    const body = await res.json();
    if (!res.ok) { alert(body.message || 'Failed'); return; }
    window.location.href = `success.html?id=${body.complaintNumber}&title=${encodeURIComponent(payload.subject)}`;
  } catch (e) { console.error(e); alert('Network error'); }
});
</script>

</body>
</html>
