<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>

    
    <script src="https://cdn.tailwindcss.com"></script>

    
    <script type="module" src="https://unpkg.com/lucide@latest"></script>

    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container" id="auth-container">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-700">Welcome</h1>

        <!-- Navigation -->
        <div class="form-toggle" id="form-toggle">
            <div class="toggle-button active" data-form="login">Login</div>
            <div class="toggle-button" data-form="signup">Sign Up</div>
        </div>

        <!-- Login -->
        <div id="login-container" class="form-section">
            <form id="login-form">
                <div class="form-group">
                    <label>Login As</label>
                    <select id="login-role" name="role">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>

              <button onclick="window.location.href='../../dashboard/home.html'" class="submit-button">
    Login
</button>
    </form>
        </div>

        <!-- Signup -->
        <div id="signup-container" class="form-section hidden">
            <form id="signup-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="signup-phone" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" required>
                </div>

                <div class="form-group">
                    <label>Re-enter Password</label>
                    <input type="password" id="signup-repassword" required>
                </div>

                <div class="form-group">
                    <label>Verification (CAPTCHA)</label>
                    <div class="captcha-box">
                        <span id="captcha-display" class="captcha-text"></span>
                        <span id="captcha-reload" class="reload-captcha" data-lucide="rotate-ccw"></span>
                    </div>
                    <input type="text" id="captcha-input" required>
                </div>

                <button type="submit" class="submit-button mt-4">
                    <span data-lucide="user-plus" class="inline-block w-5 h-5 mr-2 -mt-1"></span>
                    Sign Up
                </button>
            </form>
        </div>

        <div id="message-box" class="message-box"></div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
