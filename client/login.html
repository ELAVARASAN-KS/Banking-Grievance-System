<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Resolution Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-800 to-purple-800 flex items-center justify-center">

  <div class="w-full max-w-md p-8 bg-white/10 backdrop-blur rounded-2xl shadow-xl">
    <h1 class="text-3xl font-bold text-white text-center mb-6">Resolution Hub</h1>

    <div class="mb-4 text-gray-200">
      <label class="block mb-1">Role</label>
      <select id="role" class="w-full p-3 rounded-lg bg-gray-900 text-white">
        <option value="user">User</option>
        <option value="staff">Staff</option>
        <option value="admin">Admin</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block text-sm text-gray-200">Email / Admin Username</label>
      <input id="email" type="text" class="w-full p-3 rounded-lg bg-gray-900 text-white" placeholder="email or admin username" />
    </div>

    <div class="mb-6">
      <label class="block text-sm text-gray-200">Password</label>
      <input id="password" type="password" class="w-full p-3 rounded-lg bg-gray-900 text-white" placeholder="password" />
    </div>

    <button id="loginBtn" class="w-full py-3 rounded-lg bg-blue-500 text-white font-semibold">Login</button>

    <p class="text-center text-white/80 mt-4">
      Don't have an account? <a href="register.html" class="underline">Register</a>
    </p>
  </div>

<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const role = document.getElementById('role').value;
  const credential = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!credential || !password) { alert('Enter credentials'); return; }

  const payload = { role, password };
  if (role === 'admin') payload.adminUsername = credential;
  else payload.email = credential;

  try {
    const res = await fetch('http://localhost:8080/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    });
    const body = await res.json();
    if (!res.ok) { alert(body.message || 'Login failed'); return; }

    // Save user/staff/admin data
    localStorage.setItem('auth', JSON.stringify({ role: body.role || body.role, data: body.data || body.data }));
    if (body.role === 'admin') window.location.href = 'admin_dashboard.html';
    else if (body.role === 'staff') window.location.href = 'staff_dashboard.html';
    else window.location.href = 'user_dashboard.html';
  } catch (e) {
    console.error(e);
    alert('Network error');
  }
});
</script>

</body>
</html>
