<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Grievance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Grievance Management</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" th:href="@{/staff/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/staff/change-password}">Change Password</a>
                <a class="nav-link" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <h2 class="mb-4">Welcome, <span th:text="${staff.name}"></span>!</h2>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <p>Total Assigned</p>
                    <h3 th:text="${totalAssigned}">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <p>Pending</p>
                    <h3 th:text="${pending}">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <p>In Progress</p>
                    <h3 th:text="${inProgress}">0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);">
                    <p>Resolved</p>
                    <h3 th:text="${resolved}">0</h3>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Assigned Grievances</h4>
                <form method="get" action="/staff/dashboard" class="d-flex gap-2">
                    <select name="status" class="form-select form-select-sm" style="width: auto;">
                        <option value="">All Status</option>
                        <option value="ASSIGNED" th:selected="${selectedStatus == 'ASSIGNED'}">ASSIGNED</option>
                        <option value="IN_PROGRESS" th:selected="${selectedStatus == 'IN_PROGRESS'}">IN_PROGRESS</option>
                        <option value="RESOLVED" th:selected="${selectedStatus == 'RESOLVED'}">RESOLVED</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Filter</button>
                    <a th:href="@{/staff/dashboard}" class="btn btn-sm btn-secondary">Clear</a>
                </form>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Status</th>
                                <th>Created Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(grievances)}">
                                <td colspan="7" class="text-center">No assigned grievances</td>
                            </tr>
                            <tr th:each="grievance : ${grievances}">
                                <td th:text="${grievance.id}"></td>
                                <td th:text="${grievance.user.name}"></td>
                                <td th:text="${grievance.title}"></td>
                                <td th:text="${grievance.category}"></td>
                                <td>
                                    <span th:if="${grievance.status.name() == 'PENDING'}" class="badge badge-warning">PENDING</span>
                                    <span th:if="${grievance.status.name() == 'ASSIGNED'}" class="badge badge-info">ASSIGNED</span>
                                    <span th:if="${grievance.status.name() == 'IN_PROGRESS'}" class="badge badge-info">IN PROGRESS</span>
                                    <span th:if="${grievance.status.name() == 'RESOLVED'}" class="badge badge-success">RESOLVED</span>
                                </td>
                                <td th:text="${#temporals.format(grievance.createdDate, 'yyyy-MM-dd HH:mm')}"></td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-primary update-btn" 
                                            th:data-grievance-id="${grievance.id}"
                                            th:data-status="${grievance.status.name()}">
                                        Update Status
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Update Status Modal -->
    <div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Grievance Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/staff/update-status}" method="post">
                    <div class="modal-body">
                        <input type="hidden" id="modalGrievanceId" name="grievanceId">
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="ASSIGNED">ASSIGNED</option>
                                <option value="IN_PROGRESS">IN_PROGRESS</option>
                                <option value="RESOLVED">RESOLVED</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Enter work done details"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function openUpdateModal(grievanceId, currentStatus) {
            document.getElementById('modalGrievanceId').value = grievanceId;
            document.getElementById('status').value = currentStatus;
            var modal = new bootstrap.Modal(document.getElementById('updateModal'));
            modal.show();
        }

        // Add event listeners to all update buttons
        document.addEventListener('DOMContentLoaded', function() {
            var updateButtons = document.querySelectorAll('.update-btn');
            updateButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    var grievanceId = this.getAttribute('data-grievance-id');
                    var currentStatus = this.getAttribute('data-status');
                    openUpdateModal(grievanceId, currentStatus);
                });
            });
        });
    </script>
</body>
</html>
